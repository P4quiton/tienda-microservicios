server.address=0.0.0.0
server.port=${PORT:8007}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_DATABASE:db_pagos}}
spring.datasource.username=${DB_USERNAME:usr_pagos}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=2000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
pagos.jwt-public-key-path=${JWT_PUBLIC_KEY_PATH:}
pagos.pedidos-service-token-in=${SERVICE_TOKEN_PEDIDOS_PAGOS:}
pagos.pedidos-service-token-out=${SERVICE_TOKEN_PAGOS_PEDIDOS:}
pagos.pedidos-url=${API_PEDIDOS_URL:http://api-pedidos:8006}
# Una BD que acepta TCP pero no responde no debe colgar /ready ni los pagos: tiempos acotados (segundos).
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.loginTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=10
# Rate limiting y tamano de cuerpo (decision del equipo). En memoria POR PROCESO: con varias replicas el limite es por instancia.
pagos.rate-limit.consulta-por-min=${RATE_LIMIT_CONSULTA_POR_MIN:120}
pagos.rate-limit.mutacion-por-min=${RATE_LIMIT_MUTACION_POR_MIN:30}
pagos.rate-limit.checkout-por-min=${RATE_LIMIT_CHECKOUT_POR_MIN:5}
pagos.rate-limit.interna-por-min=${RATE_LIMIT_INTERNA_POR_MIN:300}
pagos.max-json-bytes=${MAX_JSON_BYTES:262144}
