
name: tienda-microservicios

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: postgres

      POSTGRES_USUARIOS_PASSWORD: ${POSTGRES_USUARIOS_PASSWORD:?Required}
      POSTGRES_PRODUCTOS_PASSWORD: ${POSTGRES_PRODUCTOS_PASSWORD:?Required}
      POSTGRES_ENVIOS_PASSWORD: ${POSTGRES_ENVIOS_PASSWORD:?Required}
      POSTGRES_INVENTARIO_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD:?Required}
      POSTGRES_CARRITO_PASSWORD: ${POSTGRES_CARRITO_PASSWORD:?Required}
      POSTGRES_PEDIDOS_PASSWORD: ${POSTGRES_PEDIDOS_PASSWORD:?Required}
      POSTGRES_PAGOS_PASSWORD: ${POSTGRES_PAGOS_PASSWORD:?Required}

      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1
          -U "$${POSTGRES_USER}"
          -d postgres
          -tAc "SELECT 1"
          | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:8.0
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Required}
      MONGO_INITDB_DATABASE: db_resenas
      MONGO_RESENAS_PASSWORD: ${MONGO_RESENAS_PASSWORD:?Required}

    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./infra/mongodb/init:/docker-entrypoint-initdb.d:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  api-usuarios:
    image: tienda/api-usuarios:1.0.0

    build:
      context: ./api-usuarios
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: api-usuarios
      APP_ENV: production
      APP_KEY: ${USUARIOS_APP_KEY:?Required}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8001
      APP_TIMEZONE: UTC

      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_MX

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: db_usuarios
      DB_USERNAME: usr_usuarios
      DB_PASSWORD: ${POSTGRES_USUARIOS_PASSWORD:?Required}

      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local

      HASH_DRIVER: argon2id
      ARGON_MEMORY: 65536
      ARGON_THREADS: 1
      ARGON_TIME: 4

      JWT_ISSUER: api-usuarios
      JWT_AUDIENCE: tienda-microservicios
      JWT_TTL_SECONDS: 3600
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem

      CORS_ALLOWED_ORIGINS: ""

    ports:
      - "127.0.0.1:${USUARIOS_HOST_PORT:-8001}:8001"

    volumes:
      - ./api-usuarios/storage/keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./api-usuarios/storage/keys/jwt-public.pem:/run/secrets/jwt-public.pem:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - red-tienda


networks:
  red-tienda:
    name: red-tienda
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
