
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

error_reporting = E_ALL

date.timezone = UTC

memory_limit = 256M
max_execution_time = 30
max_input_time = 30

post_max_size = 256K
upload_max_filesize = 256K
file_uploads = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
