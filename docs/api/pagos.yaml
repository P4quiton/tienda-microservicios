openapi: 3.0.3
info:
  title: API pagos
  version: 1.1.0
  description: Java / Spring Boot / PostgreSQL | Revisión de contratos checkout.
servers:
- url: http://localhost:8007
  description: Desarrollo individual
- url: http://localhost:4200
  description: Proxy frontend (solo rutas públicas o de usuario)
- url: http://api-pagos:8007
  description: Red interna
paths:
  /api/pagos/procesar:
    post:
      summary: Procesar pago simulado
      description: Identidad interna autorizada. Solo Pedidos; monto positivo calculado por backend; una transacción
        por pedido; rechazo es resultado de negocio, no error HTTP. No capturar datos bancarios reales. Persistir
        resultado y clave idempotente junto al efecto, con unicidad por pedido_id. Misma clave y payload devuelve
        resultado original; payload incompatible 409 incluso con otra clave. Nunca repetir el efecto tras timeout.
      operationId: pagos_22
      security:
      - serviceAuth: []
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: &id003
                    type: object
                    properties:
                      id: &id001
                        type: string
                        format: uuid
                      pedido_id: *id001
                      monto: &id002
                        type: string
                        pattern: ^\d{1,10}\.\d{2}$
                        example: '899.99'
                      metodo_pago:
                        type: string
                        enum:
                        - tarjeta_simulada
                        - transferencia_simulada
                      estado:
                        type: string
                        enum:
                        - aprobado
                        - rechazado
                      creado_en:
                        type: string
                        format: date-time
                    required:
                    - id
                    - pedido_id
                    - monto
                    - metodo_pago
                    - estado
                    - creado_en
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
                monto: *id002
                metodo_pago:
                  type: string
                  enum:
                  - tarjeta_simulada
                  - transferencia_simulada
              required:
              - pedido_id
              - monto
              - metodo_pago
              additionalProperties: false
  /api/pagos/pedido/{pedido_id}:
    get:
      summary: Consultar comprobante
      description: Titular/admin o identidad interna autorizada. Verificar titular mediante API Pedidos; 404 si
        no existe. Pedidos puede consultar para recuperación; 404 no garantiza que una solicitud previa no esté
        en curso. Reintentar procesamiento solo con la misma clave y payload.
      operationId: pagos_23
      security:
      - bearerAuth: []
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id003
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: pedido_id
        in: path
        required: true
        schema: *id001
  /health:
    get:
      summary: Proceso activo
      security: []
      responses:
        '200':
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-pagos
                required:
                - status
                - service
                additionalProperties: false
  /ready:
    get:
      summary: Listo para recibir tráfico
      security: []
      responses:
        '200': &id004
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-pagos
                required:
                - status
                - service
                additionalProperties: false
        '503': *id004
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - success
      - message
      - errors
      additionalProperties: false
