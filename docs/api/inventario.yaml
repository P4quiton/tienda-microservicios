openapi: 3.0.3
info:
  title: API inventario
  version: 1.3.0
  description: >
    Go / Gin / PostgreSQL. Límites por IP y por instancia, en ventanas de un minuto:
    120 consultas, 30 mutaciones administrativas y 300 llamadas internas de Pedidos.
    Los cuerpos JSON de las mutaciones tienen un máximo de 262144 bytes.
servers:
- url: http://localhost:8004
  description: Desarrollo individual
- url: http://localhost:4200
  description: Proxy frontend (solo rutas públicas o de usuario)
- url: http://api-inventario:8004
  description: Red interna
paths:
  /api/inventario/{producto_id}:
    get:
      summary: Consultar existencias
      description: 'Público. '
      operationId: inventario_10
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      producto_id: &id001
                        type: string
                        format: uuid
                      disponibles:
                        type: integer
                        minimum: 0
                    required:
                    - producto_id
                    - disponibles
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: "Error interno (sin cuerpo)"
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: producto_id
        in: path
        required: true
        schema: *id001
  /api/inventario/reservar:
    post:
      summary: Reservar existencias
      description: >
        Solo Pedidos. La reserva es atómica para todos los artículos. Si falta stock en algún artículo,
        se revierten todos los efectos de la reserva y se guarda el 409 stock_insuficiente por Idempotency-Key.
        Repetir la clave con la misma solicitud devuelve el mismo rechazo incluso tras reabastecer.
        Una clave nueva para un pedido rechazado vuelve a evaluar el stock si el pedido aún no tiene reserva.
        Pedidos debe reutilizar la clave estable al reintentar. Hay una reserva por pedido.
        Confirmada y liberada son terminales. Las reservas con pago incierto se mantienen hasta
        una transición explícita. Con la misma Idempotency-Key en curso responde 503 (errors vacío) sin repetir efectos.
      operationId: inventario_11
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: &id003
                    type: object
                    properties:
                      pedido_id: *id001
                      items:
                        type: array
                        items: &id002
                          type: object
                          properties:
                            producto_id: *id001
                            cantidad:
                              type: integer
                              minimum: 1
                          required:
                          - producto_id
                          - cantidad
                          additionalProperties: false
                      estado:
                        type: string
                        enum:
                        - reservada
                        - confirmada
                        - liberada
                    required:
                    - pedido_id
                    - items
                    - estado
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Stock insuficiente persistido por clave (errors.stock[0] = stock_insuficiente),
            conflicto de idempotencia por reutilizar la clave con otra identidad, operación o payload
            (errors.idempotency_key[0] = conflicto_idempotencia), o conflicto con la reserva del pedido o con
            el estado del inventario (errors vacío; mensaje "La operación es incompatible con el estado actual del inventario.").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                stockInsuficiente:
                  value:
                    success: false
                    message: Inventario insuficiente.
                    errors:
                      stock: [stock_insuficiente]
                conflictoIdempotencia:
                  $ref: '#/components/examples/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: "Error interno (sin cuerpo)"
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
                items:
                  type: array
                  items: *id002
                  minItems: 1
              required:
              - pedido_id
              - items
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /api/inventario/reabastecer:
    post:
      summary: Reabastecer
      description: JWT admin. Validar producto existente; crear registro si no existe. Con la misma Idempotency-Key en curso responde 503 (errors vacío) sin repetir efectos.
      operationId: inventario_12
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      producto_id: *id001
                      disponibles:
                        type: integer
                        minimum: 0
                    required:
                    - producto_id
                    - disponibles
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/InventoryConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: "Error interno (sin cuerpo)"
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /api/inventario/confirmar:
    post:
      summary: Confirmar reserva
      description: Identidad interna autorizada. Solo Pedidos. Transición atómica e idempotente; estado final confirmada;
        409 si transición incompatible. Persistir clave, hash y resultado en la misma transacción que el efecto.
        Una reserva por pedido; reintentos con misma clave devuelven resultado registrado. No liberar por timeout
        ni caducar automáticamente una reserva con pago incierto. Confirmada y liberada son terminales.
        Con la misma Idempotency-Key en curso responde 503 (errors vacío) sin repetir efectos.
      operationId: inventario_13
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id003
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/InventoryConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: "Error interno (sin cuerpo)"
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
              required:
              - pedido_id
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /api/inventario/liberar:
    post:
      summary: Liberar reserva
      description: Identidad interna autorizada. Solo Pedidos. Transición atómica e idempotente; estado final liberada;
        409 si transición incompatible. Persistir clave, hash y resultado en la misma transacción que el efecto.
        Una reserva por pedido; reintentos con misma clave devuelven resultado registrado. No liberar por timeout
        ni caducar automáticamente una reserva con pago incierto. Confirmada y liberada son terminales.
        Con la misma Idempotency-Key en curso responde 503 (errors vacío) sin repetir efectos.
      operationId: inventario_14
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id003
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/InventoryConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: "Error interno (sin cuerpo)"
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
              required:
              - pedido_id
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /health:
    get:
      summary: Proceso activo
      security: []
      responses:
        '200':
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-inventario
                required:
                - status
                - service
                additionalProperties: false
        '500':
          description: "Error interno (sin cuerpo)"
  /ready:
    get:
      summary: Listo para recibir tráfico
      security: []
      responses:
        '200': &id004
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-inventario
                required:
                - status
                - service
                additionalProperties: false
        '503': *id004
        '500':
          description: "Error interno (sin cuerpo)"
components:
  responses:
    InventoryConflict:
      description: >
        Conflicto con el estado del inventario (errors vacío; mensaje "La operación es incompatible con el
        estado actual del inventario.") o conflicto de idempotencia al reutilizar la clave con otra identidad,
        operación o payload (errors.idempotency_key[0] = conflicto_idempotencia).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflictoIdempotencia:
              $ref: '#/components/examples/IdempotencyConflict'
    BodyTooLarge:
      description: El cuerpo de la solicitud supera los 262144 bytes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitExceeded:
      description: Límite de peticiones por minuto superado.
      headers:
        Retry-After:
          required: true
          description: Segundos hasta que vence la ventana.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  examples:
    IdempotencyConflict:
      value:
        success: false
        message: La clave de idempotencia ya se usó con otros datos.
        errors:
          idempotency_key: [conflicto_idempotencia]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - success
      - message
      - errors
      additionalProperties: false
