openapi: 3.0.3
info:
  title: API inventario
  version: 1.1.0
  description: Go / Gin / PostgreSQL | Revisión de contratos checkout.
servers:
- url: http://localhost:8004
  description: Desarrollo individual
- url: http://localhost:4200
  description: Proxy frontend (solo rutas públicas o de usuario)
- url: http://api-inventario:8004
  description: Red interna
paths:
  /api/inventario/{producto_id}:
    get:
      summary: Consultar existencias
      description: 'Público. '
      operationId: inventario_10
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      producto_id: &id001
                        type: string
                        format: uuid
                      disponibles:
                        type: integer
                        minimum: 0
                    required:
                    - producto_id
                    - disponibles
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: producto_id
        in: path
        required: true
        schema: *id001
  /api/inventario/reservar:
    post:
      summary: Reservar existencias
      description: Identidad interna autorizada. Solo Pedidos; operación atómica para todos los artículos; 409 si
        stock insuficiente; mismo pedido y contenido no descuenta dos veces. Persistir clave, hash y resultado en
        la misma transacción que el efecto. Una reserva por pedido; reintentos con misma clave devuelven resultado
        registrado. No liberar por timeout ni caducar automáticamente una reserva con pago incierto. Confirmada
        y liberada son terminales.
      operationId: inventario_11
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: &id003
                    type: object
                    properties:
                      pedido_id: *id001
                      items:
                        type: array
                        items: &id002
                          type: object
                          properties:
                            producto_id: *id001
                            cantidad:
                              type: integer
                              minimum: 1
                          required:
                          - producto_id
                          - cantidad
                          additionalProperties: false
                      estado:
                        type: string
                        enum:
                        - reservada
                        - confirmada
                        - liberada
                    required:
                    - pedido_id
                    - items
                    - estado
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
                items:
                  type: array
                  items: *id002
                  minItems: 1
              required:
              - pedido_id
              - items
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /api/inventario/reabastecer:
    post:
      summary: Reabastecer
      description: JWT admin. Validar producto existente; crear registro si no existe.
      operationId: inventario_12
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      producto_id: *id001
                      disponibles:
                        type: integer
                        minimum: 0
                    required:
                    - producto_id
                    - disponibles
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /api/inventario/confirmar:
    post:
      summary: Confirmar reserva
      description: Identidad interna autorizada. Solo Pedidos. Transición atómica e idempotente; estado final confirmada;
        409 si transición incompatible. Persistir clave, hash y resultado en la misma transacción que el efecto.
        Una reserva por pedido; reintentos con misma clave devuelven resultado registrado. No liberar por timeout
        ni caducar automáticamente una reserva con pago incierto. Confirmada y liberada son terminales.
      operationId: inventario_13
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id003
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
              required:
              - pedido_id
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /api/inventario/liberar:
    post:
      summary: Liberar reserva
      description: Identidad interna autorizada. Solo Pedidos. Transición atómica e idempotente; estado final liberada;
        409 si transición incompatible. Persistir clave, hash y resultado en la misma transacción que el efecto.
        Una reserva por pedido; reintentos con misma clave devuelven resultado registrado. No liberar por timeout
        ni caducar automáticamente una reserva con pago incierto. Confirmada y liberada son terminales.
      operationId: inventario_14
      security:
      - serviceAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id003
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedido_id: *id001
              required:
