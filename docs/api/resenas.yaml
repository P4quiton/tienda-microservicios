openapi: 3.0.3
info:
  title: API resenas
  version: 1.0.0
  description: Python / FastAPI / MongoDB | Contrato inicial propuesto y aprobado a nivel de arquitectura.
servers:
- url: http://localhost:8008
  description: Desarrollo individual
- url: http://localhost:4200
  description: Proxy frontend (solo rutas públicas o de usuario)
- url: http://api-resenas:8008
  description: Red interna
paths:
  /api/resenas/producto/{producto_id}:
    get:
      summary: Consultar reseñas
      description: 'Público. Sin reseñas: promedio null, total 0.'
      operationId: resenas_24
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: &id002
                          type: object
                          properties:
                            id: &id001
                              type: string
                              format: uuid
                            producto_id: *id001
                            usuario_id: *id001
                            calificacion:
                              type: integer
                              minimum: 1
                              maximum: 5
                            comentario:
                              type: string
                              maxLength: 1000
                            creado_en:
                              type: string
                              format: date-time
                          required:
                          - id
                          - producto_id
                          - usuario_id
                          - calificacion
                          - comentario
                          - creado_en
                          additionalProperties: false
                      promedio:
                        type: number
                        minimum: 0
                        maximum: 5
                        nullable: true
                      total:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - promedio
                    - total
                    additionalProperties: false
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: producto_id
        in: path
        required: true
        schema: *id001
  /api/resenas:
    post:
      summary: Crear reseña
      description: JWT cliente o admin. Usuario desde sub; verificar producto; una reseña por usuario y producto
        (409 si duplicada).
      operationId: resenas_25
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data: *id002
                required:
                - success
                - message
                - data
                additionalProperties: false
        '400':
          description: JSON incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                producto_id: *id001
                calificacion:
                  type: integer
                  minimum: 1
                  maximum: 5
                comentario:
                  type: string
                  maxLength: 1000
              required:
              - producto_id
              - calificacion
              - comentario
              additionalProperties: false
  /health:
    get:
      summary: Proceso activo
      security: []
      responses:
        '200':
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-resenas
                required:
                - status
                - service
                additionalProperties: false
  /ready:
    get:
      summary: Listo para recibir tráfico
      security: []
      responses:
        '200': &id003
          description: Estado operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  service:
                    type: string
                    example: api-resenas
                required:
                - status
                - service
                additionalProperties: false
        '503': *id003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - success
      - message
      - errors
      additionalProperties: false
