server {
    listen 4200;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 256k;
    proxy_read_timeout 120s;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Frontera de confianza: nginx fija las cabeceras de IP y host (sobrescribe, no anexa) y elimina
    # Forwarded, para que un cliente no pueda falsificar la IP que ven las APIs.
    # Browser allowlist: internal service operations are intentionally not proxied.
    location = /api/usuarios/registro {
        limit_except POST { deny all; }
        set $up_usuarios http://api-usuarios:8001;
        proxy_pass $up_usuarios;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/usuarios/login {
        limit_except POST { deny all; }
        set $up_usuarios http://api-usuarios:8001;
        proxy_pass $up_usuarios;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location ~ "^/api/usuarios/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        set $up_usuarios http://api-usuarios:8001;
        proxy_pass $up_usuarios;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/productos {
        limit_except GET { deny all; }
        set $up_productos http://api-productos:8002;
        proxy_pass $up_productos;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
