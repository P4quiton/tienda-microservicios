server {
    listen 4200;
    client_max_body_size 256k;
    proxy_read_timeout 120s;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Browser allowlist: internal service operations are intentionally not proxied.
    location = /api/usuarios/registro {
        limit_except POST { deny all; }
        proxy_pass http://api-usuarios:8001;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/usuarios/login {
        limit_except POST { deny all; }
        proxy_pass http://api-usuarios:8001;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/usuarios/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-usuarios:8001;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/productos {
        limit_except GET { deny all; }
        proxy_pass http://api-productos:8002;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/productos/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-productos:8002;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/envios/cotizar {
        limit_except POST { deny all; }
        proxy_pass http://api-envios:8003;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/envios/rastreo/[A-Za-z0-9-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://api-envios:8003;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/api/inventario/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-inventario:8004;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/api/carrito/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-carrito:8005;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/carrito/[0-9A-Fa-f-]{36}/agregar$" {
        limit_except POST { deny all; }
        proxy_pass http://api-carrito:8005;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/pedidos {
        limit_except POST { deny all; }
        proxy_pass http://api-pedidos:8006;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/pedidos/usuario/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-pedidos:8006;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/pedidos/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-pedidos:8006;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/api/pagos/pedido/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-pagos:8007;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/resenas {
        limit_except POST { deny all; }
        proxy_pass http://api-resenas:8008;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/resenas/producto/[0-9A-Fa-f-]{36}$" {
        limit_except GET { deny all; }
        proxy_pass http://api-resenas:8008;
        proxy_set_header X-Service-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
