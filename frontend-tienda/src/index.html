<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nébula</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="brand/nebula-emblema.svg">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('nebula-tema'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
